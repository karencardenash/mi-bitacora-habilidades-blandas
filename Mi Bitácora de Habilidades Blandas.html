<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mi Bitácora de Habilidades Blandas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna de app móvil (máx. 520px) con navegación fija abajo; la mascota acompaña cada pantalla y las lecciones abren a pantalla completa. */
:root{
  --bg:#0B0A14; --surface:#15132A; --surface2:#1D1A38; --ink:#F2F0FB; --muted:#A09DBC; --line:#2D2A4D;
  --brand:#7B52C9; --brand-deep:#58348F; --brand-ink:#FFFFFF; --brand-t:#B9A0FF; --brand-soft:#241C47;
  --hero-a:#7A45D6; --hero-b:#4A5CD8;
  --g1:#A23BFF; --g2:#5E7BFF; --g3:#00D9FF;
  --halo:rgba(135,103,198,.18); --grid:rgba(255,255,255,.04);
  --int:#0F8FB3; --int-t:#4DD8FF; --cog:#7C4FD6; --cog-t:#BBA2FF; --emo:#D13F87; --emo-t:#FF86BC;
  --xp:#FFC24D; --hot:#FF8A4C;
  --good:#3EE08A; --good-f:#16A058; --good-soft:#10301F; --bad:#FF7A70; --bad-soft:#3A1C22;
  --font-d:'Outfit','Segoe UI',system-ui,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F8F1E7; --surface:#FFFCF7; --surface2:#F1E8DA; --ink:#1B1633; --muted:#675F80; --line:#E4D8C5;
    --brand-t:#6240B0; --brand-soft:#ECE4F8;
    --g1:#7B2FD6; --g2:#3F5FE0; --g3:#0690B5;
    --halo:rgba(135,103,198,.16); --grid:rgba(27,22,51,.05);
    --int-t:#0A7491; --cog-t:#6240B0; --emo-t:#B02A6E;
    --xp:#B87800; --hot:#D9560E;
    --good:#12803F; --good-soft:#DCF3E4; --bad:#C23A32; --bad-soft:#FBE3E0;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F8F1E7; --surface:#FFFCF7; --surface2:#F1E8DA; --ink:#1B1633; --muted:#675F80; --line:#E4D8C5;
  --brand-t:#6240B0; --brand-soft:#ECE4F8;
  --g1:#7B2FD6; --g2:#3F5FE0; --g3:#0690B5;
  --halo:rgba(135,103,198,.16); --grid:rgba(27,22,51,.05);
  --int-t:#0A7491; --cog-t:#6240B0; --emo-t:#B02A6E;
  --xp:#B87800; --hot:#D9560E;
  --good:#12803F; --good-soft:#DCF3E4; --bad:#C23A32; --bad-soft:#FBE3E0;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-b); font-size:16px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--g3);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:18px calc(104px + env(safe-area-inset-bottom,0px));min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
svg{display:block;flex:none}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.num{font-variant-numeric:tabular-nums;font-weight:700}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);min-height:46px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 var(--brand-deep)}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.big{width:100%;padding:15px 18px;font-size:1.05rem;letter-spacing:.02em}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:12px}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:0 0 0 1.5px var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:var(--brand-soft);color:var(--brand-t);border:0}
button.chip{cursor:pointer}
button.chip.on{background:var(--brand);color:var(--brand-ink)}
.chip.prio{background:var(--bad-soft);color:var(--bad)}

/* Mascota */
.mascot{display:block;overflow:visible;flex:none;max-width:100%;height:auto}
.mascot .halo{fill:var(--halo)}
.mascot .b-dark{fill:#7355B5}
.mascot .b-light{fill:#8767C6}
.mascot .sclera{fill:#fff}
.mascot .pupil{fill:#173B4B;transition:transform .12s ease-out;transform:translate(calc(var(--lx,0)*3px),calc(var(--ly,0)*2.5px))}
.mascot .eye{transform-box:fill-box;transform-origin:50% 50%;transition:transform .07s}
.mascot.blink .eye{transform:scaleY(.08)}
.mascot .lid,.mascot .mouth{fill:none;stroke:#173B4B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mascot .lid,.mascot .mouth,.mascot .spark,.mascot .zzz{display:none}
.mascot .m-cheer,.mascot .m-wow{fill:#173B4B}
.mascot[data-mood="happy"] .m-happy,.mascot[data-mood="cheer"] .m-cheer,.mascot[data-mood="oops"] .m-oops,
.mascot[data-mood="think"] .m-think,.mascot[data-mood="wow"] .m-wow,.mascot[data-mood="sleep"] .m-sleep{display:inline}
.mascot[data-mood="cheer"] .spark,.mascot[data-mood="sleep"] .zzz{display:inline}
.mascot[data-mood="sleep"] .sclera,.mascot[data-mood="sleep"] .pupil{display:none}
.mascot[data-mood="sleep"] .lid{display:inline}
.mascot[data-mood="think"] .pupil{transform:translate(2.5px,-3px)}
.mascot[data-mood="oops"] .pupil{transform:translate(0,3px)}
.mascot[data-mood="wow"] .sclera{transform-box:fill-box;transform-origin:center;transform:scale(1.15)}
.mascot .spark path{fill:var(--xp);transform-box:fill-box;transform-origin:center;animation:tw 1.3s ease-in-out infinite}
.mascot .spark g:nth-child(2) path{animation-delay:.4s}.mascot .spark g:nth-child(3) path{animation-delay:.8s}
.mascot .zzz{fill:var(--brand-t);font:800 20px var(--font-d);animation:zz 2.6s ease-in-out infinite}
.mascot .zzz.z2{animation-delay:1.1s;font-size:15px}
.mascot .float{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3.6s ease-in-out infinite}
.mascot[data-mood="sleep"] .float{animation-duration:6s}
.mascot[data-mood="cheer"] .float{animation:cheer .9s ease-in-out infinite}
.mascot.hop .float{animation:hop .62s ease-out 1}
.mascot.shake .float{animation:shake .5s ease-in-out 1}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(.985,1.02)}}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-9px) scale(.97,1.05)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-24px) scale(.95,1.07)}60%{transform:translateY(0) scale(1.07,.92)}100%{transform:translateY(0) scale(1,1)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px) rotate(-2deg)}80%{transform:translateX(4px) rotate(1deg)}}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}40%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .mascot .float,.mascot[data-mood="cheer"] .float,.mascot.hop .float,.mascot.shake .float,.mascot .spark path,.mascot .zzz,.say,.node.today::after{animation:none}
  .confetti{display:none}
}
.mbtn{border:0;background:transparent;padding:0;border-radius:24px;flex:none;line-height:0}
.mrow{display:flex;align-items:center;gap:12px}
.mbox{display:grid;justify-items:center;gap:14px}
.say{position:relative;flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:600;line-height:1.35;animation:pop .25s ease-out}
.say::before{content:"";position:absolute;left:-8px;top:50%;width:13px;height:13px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.say.up{flex:none;text-align:center}
.say.up::before{left:50%;top:-8px;border:0;border-top:2px solid var(--line);border-left:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:1.6rem}
.stats{display:flex;gap:8px}
.stat{display:flex;align-items:center;gap:5px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1.5px var(--line);font-variant-numeric:tabular-nums}
.stat.hot{color:var(--hot)} .stat.xp{color:var(--xp)}

/* Tarjeta de hoy */
.today{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:24px;padding:20px;display:grid;gap:12px;box-shadow:0 5px 0 var(--brand-deep)}
.today .label{color:inherit;opacity:.85}
.today h2{font-size:1.5rem}
.today .btn{background:#fff;color:#4A3A9A;box-shadow:0 4px 0 rgba(0,0,0,.25);width:100%;font-size:1.02rem}
.today.rest{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line)}
.today.rest .label{color:var(--muted)}
.today.rest .btn{background:var(--brand);color:var(--brand-ink)}
.prios{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}

/* Ruta */
.path{display:grid;gap:30px;margin-top:26px}
.step{display:flex;align-items:center;gap:14px;padding-left:calc(40px + var(--off,0px));min-width:0}
.nodew{position:relative;flex:none}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.28)}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.node.done{background:var(--good-f)}
.node.locked{background:var(--surface2);color:var(--muted);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.node.today::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--c);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.88);opacity:.9}100%{transform:scale(1.12);opacity:0}}
.sitter{position:absolute;left:44px;top:-46px;width:62px;z-index:2;pointer-events:none}
.step-t{display:grid;gap:2px;min-width:0}
.step-t b{font-size:.98rem;line-height:1.25}
.step-t span{font-size:.82rem;color:var(--muted)}
.step-t .late{color:var(--hot);font-weight:700}

/* Diario */
.moods{display:flex;gap:8px;flex-wrap:wrap}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:130px;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand-t)}
.entry{display:grid;gap:8px}
.entry .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.entry .q{font-weight:700;font-size:.92rem}
.entry .t{white-space:pre-wrap;overflow-wrap:anywhere}
.sk-dot{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;flex:none}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-size:1.25rem;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-grid .wd{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.cd{position:relative;aspect-ratio:1;border-radius:12px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-weight:500;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.cd.empty{background:transparent;box-shadow:none}
.cd span{grid-area:1/1;align-self:start;margin-top:5px;font-size:.88rem}
.cd svg{grid-area:1/1;align-self:end;margin-bottom:4px}
.cd.done{background:var(--good-soft);color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.cd.open{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand-t)}
.cd.locked{color:var(--muted);background:transparent}
.cd.today{outline:3px solid var(--xp);outline-offset:1px}
.cd.sel{background:var(--ink);color:var(--bg);box-shadow:none}
.dd{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--hot)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* Perfil y categorías */
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:1.7rem;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--font-d);font-size:1.5rem;font-variant-numeric:tabular-nums}
.cat-h{display:grid;gap:6px;margin-bottom:4px}
.cat-t{color:var(--ct);font-family:var(--font-d);font-size:1.1rem}
.skrow{display:grid;gap:6px;padding:10px 0;border-top:1.5px solid var(--line)}
.track{position:relative;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track .base{background:color-mix(in srgb,var(--c) 40%,var(--line))}
.track .now{background:var(--c)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{border-radius:16px;padding:12px;background:var(--bg);display:grid;gap:3px;box-shadow:inset 0 0 0 1.5px var(--line)}
.badge.on{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand-t)}
.badge:not(.on){opacity:.6}
.badge b{font-size:.92rem}
.badge span{font-size:.78rem;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.88rem}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:.74rem;font-weight:700}
.nav button.on{color:var(--brand-t);background:var(--brand-soft)}

/* Onboarding */
.hero{position:relative;isolation:isolate;display:grid;justify-items:center;gap:16px;text-align:center;padding-top:4vh}
.hero::before{content:"";position:absolute;z-index:-1;inset:-18px -16px auto;height:380px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ttl{font-size:2.35rem;font-weight:800}
.points{display:grid;gap:12px;margin:4px 0;text-align:left;width:100%}
.points div{display:flex;gap:12px;align-items:center}
.points .pi{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand-t);display:grid;place-items:center;flex:none}
.progress{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px;transition:width .3s}
.choice-cards{display:grid;gap:10px}
.pc{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;font-weight:700}
.pc.on{border-color:var(--brand-t);background:var(--brand-soft)}
.ans{display:grid;gap:10px}
.ans button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 16px;text-align:left;font-weight:700;box-shadow:0 3px 0 var(--line)}
.ans button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ans button.on{border-color:var(--brand-t);background:var(--brand-soft)}
.qtext{font-family:var(--font-d);font-size:1.4rem;line-height:1.25;font-weight:700}

/* Lección */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay[hidden]{display:none}
.ls-head{display:flex;align-items:center;gap:8px;max-width:560px;width:100%;margin:0 auto;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.ls-head .progress{flex:1}
.ls-body{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:18px 0;display:grid;gap:16px;align-content:start}
.ls-kind{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ls-q{font-size:1.4rem}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;font-weight:500;box-shadow:0 3px 0 var(--line);line-height:1.35}
.opt.on{border-color:var(--brand-t);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.slots li{counter-increment:s;display:flex;align-items:center;gap:10px;min-height:52px}
.slots li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.slot-empty{flex:1;border:2px dashed var(--line);border-radius:14px;min-height:52px}
.chipx{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:500;text-align:left;box-shadow:0 3px 0 var(--line);line-height:1.3}
.slots .chipx{flex:1}
.chipx.right{border-color:var(--good);background:var(--good-soft)}
.chipx.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1.5px solid var(--line)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;font-size:.92rem;line-height:1.3;box-shadow:0 3px 0 var(--line);min-height:62px}
.mi.on{border-color:var(--brand-t);background:var(--brand-soft)}
.mi.ok{border-color:var(--good);background:var(--good-soft);box-shadow:none;opacity:.8}
.mi.bad{border-color:var(--bad);background:var(--bad-soft)}
.ls-foot{max-width:560px;width:100%;margin:0 auto;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb p{color:var(--ink);font-size:.92rem}
.sum{position:relative;display:grid;gap:16px;text-align:center;justify-items:center;padding-top:3vh}
.sum .say{flex:none}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.sum-stats div{background:var(--surface);border-radius:16px;padding:12px 6px;box-shadow:0 0 0 1.5px var(--line)}
.sum-stats b{display:block;font-family:var(--font-d);font-size:1.4rem}
.confetti{position:absolute;top:0;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.6s ease-in infinite}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(300px) rotate(360deg);opacity:0}}
.confirm{background:var(--bad-soft);border-radius:16px;padding:14px;display:grid;gap:10px}

#toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 16px 8px 10px;border-radius:16px;font-weight:700;font-size:.9rem;max-width:420px}
</style>

/* ---------- Utilidades ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){var A=a.split('-').map(Number),B=b.split('-').map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5);}
function today(){var d=new Date();d.setDate(d.getDate()+state.demo);return ymd(d);}
function fmt(s){var d=parse(s);return WD3[d.getDay()]+' '+d.getDate()+' '+MES3[d.getMonth()];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function untilTomorrow(){var n=new Date();var t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);var m=Math.max(0,Math.floor((t-n)/60000));return Math.floor(m/60)+' h '+(m%60)+' min';}
function toast(msg){var t=document.createElement('div');t.className='toast';t.innerHTML=mascot(30,'cheer','')+'<span></span>';t.lastChild.textContent=msg;$('#toasts').appendChild(t);setTimeout(function(){t.remove();},2400);}
function first(){return state.name.trim().split(/\s+/)[0]||'';}

function dayIdx(){return diffDays(state.start,today());}
function pctOf(s){return Math.round(state.scores[s]/5*100);}
function doneOfSkill(s){var n=0;state.journey.forEach(function(j,i){if(j.s===s&&state.done[i])n++;});return n;}
function curPct(s){return Math.min(100,pctOf(s)+10*doneOfSkill(s));}
function activitySet(){var set={};Object.keys(state.done).forEach(function(k){set[state.done[k].date]=1;});return set;}
function streak(){var set=activitySet();var d=today();if(!set[d])d=addDays(d,-1);var n=0;while(set[d]){n++;d=addDays(d,-1);}return n;}
function doneCount(){return Object.keys(state.done).length;}
function sortedSkills(sc){return SKILLS.slice().sort(function(a,b){return sc[a.id]-sc[b.id]||a.i-b.i;});}
function weakest(n){return sortedSkills(state.scores).slice(0,n);}
function buildJourney(sc){
  var order=sortedSkills(sc).map(function(s){return s.id;});
  var rounds=[order,order.slice(0,6),order.slice(0,3)];var j=[];
  rounds.forEach(function(r,li){r.forEach(function(s){j.push({s:s,l:li});});});
  return j;
}
function lessonOf(i){var j=state.journey[i];return LESSONS[j.s][j.l];}

/* ---------- Ruta ---------- */
function rutaSay(){
  var n=state.journey.length,di=dayIdx(),st=streak(),pend=[];
  for(var i=0;i<n&&i<=di;i++){if(!state.done[i])pend.push(i);}
  if(doneCount()===n)return {m:'cheer',t:'¡Completaste toda la ruta, '+first()+'! Estoy muy orgulloso.'};
  if(di<n&&state.done[di]&&!pend.length)return {m:'sleep',t:'Hoy ya cumpliste. Me voy a dormir un ratito; el próximo nivel se abre en '+untilTomorrow()+'.'};
  if(pend.length&&!(di<n&&!state.done[di]))return {m:'think',t:'Te quedan niveles pendientes. No pasa nada, yo te acompaño a ponerte al día.'};
  var title=lessonOf(Math.min(di,n-1)).t;
  if(st>=3)return {m:'cheer',t:'¡'+st+' días seguidos! Hoy toca “'+title+'”. No rompamos la racha.'};
  return {m:'happy',t:'¡Hola, '+first()+'! Hoy toca “'+title+'”. Son solo unos minutos.'};
}

  }else{

  }

  }
  var pr=weakest(3).map(function(s){return '<span class="chip" style="background:'+s.c+';color:#fff">'+esc(s.name)+'</span>';}).join('');
  var path='';

    if(state.done[k]){cls='done';sub=esc(s.name)+' · completado';}

    var icon=cls==='done'?ic('check',34):cls==='locked'?ic('lock',28):ic(j.s,32);

    path+='<div class="step" style="--off:'+offs[k%offs.length]+'px"><div class="nodew"><button class="node '+cls+'" style="--c:'+s.c+'" data-act="open" data-i="'+k+'" aria-label="Nivel '+(k+1)+': '+esc(L2.t)+'">'+icon+'</button>'+sitter+'</div><div class="step-t"><b>'+(k+1)+'. '+esc(L2.t)+'</b><span>'+sub+'</span></div></div>';
  }

  return '<div class="top"><div><p class="label">'+esc(state.program)+'</p><h1>Hola, '+esc(first())+'</h1></div><div class="stats"><span class="stat hot" title="Racha">'+ic('flame',18)+st+'</span><span class="stat xp" title="Experiencia">'+ic('bolt',18)+state.xp+'</span></div></div>'+
  '<div class="stack">'+mrow(92,rs.m,rs.t)+card+'</div><div class="prios"><span class="label">Tus prioridades</span>'+pr+'</div>'+
  '<div class="row" style="justify-content:space-between;margin-top:26px"><h2 style="font-size:1.25rem">Tu ruta</h2><span class="muted small">'+doneCount()+' de '+n+' niveles · nivel '+lv+'</span></div><div class="path">'+path+'</div>';
}

  ['L','M','M','J','V','S','D'].forEach(function(w){cells+='<span class="wd">'+w+'</span>';});
  for(var i=0;i<lead;i++)cells+='<span class="cd empty"></span>';

    if(sel<=t)detail+='<button class="btn primary" data-act="open" data-i="'+li2+'" style="margin-top:12px">'+(state.done[li2]?'Repasar nivel':'Ir al nivel')+'</button>';
  }else{
    mt=sel<state.start?'Este día es anterior al inicio de tu ruta.':'No hay nivel este día. ¡Aprovecha para escribir en tu diario!';
    detail+='<p class="muted">'+(sel<state.start?'Este día es anterior al inicio de tu ruta.':'No hay nivel este día.')+'</p>';
  }

  return '<div class="top"><h1>Calendario</h1><button class="btn sm" data-act="cal-today">Hoy</button></div>'+
  '<div class="card"><div class="cal-head"><button class="icon-btn" data-act="cal-prev" aria-label="Mes anterior">'+ic('left')+'</button><h2>'+MESES[c.m]+' '+c.y+'</h2><button class="icon-btn" data-act="cal-next" aria-label="Mes siguiente">'+ic('right')+'</button></div><div class="cal-grid">'+cells+'</div>'+
  '<div class="legend"><span><i style="background:var(--good-soft);box-shadow:inset 0 0 0 1.5px var(--good)"></i>Hecho</span><span><i style="background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand-t)"></i>Disponible</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--line)"></i>Bloqueado</span><span><i style="background:var(--hot);border-radius:50%;width:8px;height:8px"></i>Diario</span></div></div>'+
  '<div class="stack" style="margin-top:14px">'+mrow(80,mm,mt)+'<div class="card"><p class="label" style="margin-bottom:8px">'+fmt(sel)+'</p>'+detail+'</div></div>';

/* ---------- Lección ---------- */
function prep(ex){
  if(ex.k==='choice')return {opts:shuffle(ex.o.map(function(t,i){return {t:t,i:i};})),sel:null};
  if(ex.k==='order'){var bank,tr=0;do{bank=shuffle(ex.items.map(function(_,i){return i;}));tr++;}while(tr<8&&bank.every(function(v,i){return v===i;}));return {bank:bank,ans:[]};}
  if(ex.k==='match')return {right:shuffle(ex.pairs.map(function(_,i){return i;})),done:ex.pairs.map(function(){return false;}),selL:null,miss:0,flash:-1};
  return {text:''};
}
function curEx(){return ui.lesson.lesson.ex[ui.lesson.ei];}
function openLesson(i,review){
  var j=state.journey[i],lesson=LESSONS[j.s][j.l];
  ui.lesson={idx:i,skill:j.s,lesson:lesson,ei:0,p:prep(lesson.ex[0]),phase:'q',fb:null,xp:0,ok:0,tot:0,review:review,exit:false};
  renderLesson();
}
function tipFor(ex){
  if(ex.k==='choice')return pick(['Lee con calma y elige lo que haría alguien con experiencia.','Piensa en una situación real de tu carrera.','No hay prisa. Elige la que más te sirva.']);
  if(ex.k==='order')return 'Toca los pasos en orden. Si te equivocas, tócalos de nuevo para quitarlos.';
  if(ex.k==='match')return 'Toca uno de la izquierda y luego su pareja de la derecha.';
  return 'Esta es para ti. Escribe con sinceridad: se guarda en tu diario.';
}
function confetti(){
  var cols=['var(--g1)','var(--g2)','var(--g3)','var(--xp)','var(--good-f)','var(--emo)'],h='';
  for(var i=0;i<18;i++)h+='<span class="confetti" style="left:'+(4+i*5.3)+'%;background:'+cols[i%cols.length]+';animation-delay:'+((i*0.37)%2.2).toFixed(2)+'s;animation-duration:'+(2.2+(i%4)*0.4).toFixed(1)+'s"></span>';
  return h;
}
function renderLesson(){
  var el=$('#lesson'),L=ui.lesson;
  if(!L){el.hidden=true;el.innerHTML='';document.body.classList.remove('lock');return;}
  el.hidden=false;document.body.classList.add('lock');
  var sk=SK[L.skill],total=L.lesson.ex.length;
  if(L.phase==='summary'){
    var idx=L.idx,n=state.journey.length,di=dayIdx(),nxt='';
    if(idx+1<n){nxt=(idx+1<=di)?'El siguiente nivel ya está disponible.':'El siguiente nivel se desbloquea el '+fmt(addDays(state.start,idx+1))+'. ¡Vuelve mañana!';}
    else nxt='Terminaste toda la ruta.';
    var good=L.tot?L.ok/L.tot>=0.5:true;
    el.innerHTML='<div class="ls-body"><div class="sum">'+confetti()+'<button type="button" class="mbtn" data-act="mtap" aria-label="Tocar a la mascota">'+mascot(170,good?'cheer':'happy','')+'</button><div class="say up"><span class="say-t">'+esc(L.review?'¡Buen repaso, '+first()+'!':'¡Lo lograste, '+first()+'! Ese nivel ya es tuyo.')+'</span></div><h1 style="font-size:1.9rem">'+(L.review?'Repaso terminado':'Nivel completado')+'</h1><p class="muted">'+esc(L.lesson.t)+'</p>'+
    '<div class="sum-stats"><div><b style="color:var(--xp)">+'+L.xp+'</b><span class="muted small">XP</span></div><div><b>'+L.ok+'/'+L.tot+'</b><span class="muted small">aciertos</span></div><div><b style="color:var(--hot)">'+streak()+'</b><span class="muted small">racha</span></div></div>'+
    '<p class="muted">'+(L.review?'Repasar no suma XP.':esc(nxt))+'</p></div></div><div class="ls-foot"><button class="btn primary big" data-act="lesson-close">Volver a la ruta</button></div>';
    aim();return;
  }
  var ex=curEx(),p=L.p,fb=L.phase==='fb',body='',foot='';
  if(ex.k==='choice'){
    body='<p class="ls-kind">Elige la mejor opción</p><h2 class="ls-q">'+esc(ex.q)+'</h2><div class="opts">'+p.opts.map(function(o,k){
      var c='opt'+(p.sel===k?' on':'');
      if(fb){if(o.i===ex.a)c='opt right';else if(p.sel===k)c='opt wrong';else c='opt';}
      return '<button class="'+c+'" data-act="pick" data-i="'+k+'"'+(fb?' disabled':'')+'>'+esc(o.t)+'</button>';}).join('')+'</div>';
    if(!fb)foot='<button class="btn primary big" data-act="check"'+(p.sel===null?' disabled':'')+'>Comprobar</button>';
  }else if(ex.k==='order'){
    var slots='';
    for(var s=0;s<ex.items.length;s++){
      if(s<p.ans.length){var v=p.ans[s],cc='chipx'+(fb?(v===s?' right':' wrong'):'');slots+='<li><button class="'+cc+'" data-act="ord-rem" data-i="'+s+'"'+(fb?' disabled':'')+'>'+esc(ex.items[v])+'</button></li>';}
      else slots+='<li><span class="slot-empty"></span></li>';
    }
    body='<p class="ls-kind">Ordena los pasos</p><h2 class="ls-q">'+esc(ex.q)+'</h2><ol class="slots">'+slots+'</ol>'+(fb?'':'<div class="bank">'+p.bank.map(function(v){return '<button class="chipx" data-act="ord-add" data-i="'+v+'">'+esc(ex.items[v])+'</button>';}).join('')+'</div>');
    if(!fb)foot='<button class="btn primary big" data-act="check"'+(p.ans.length===ex.items.length?'':' disabled')+'>Comprobar</button>';
  }else if(ex.k==='match'){
    body='<p class="ls-kind">Une las parejas</p><h2 class="ls-q">'+esc(ex.q)+'</h2><div class="mt"><div class="mcol">'+ex.pairs.map(function(pr,i){return '<button class="mi'+(p.done[i]?' ok':'')+(p.selL===i?' on':'')+'" data-act="m-left" data-i="'+i+'"'+(p.done[i]?' disabled':'')+'>'+esc(pr[0])+'</button>';}).join('')+'</div><div class="mcol">'+p.right.map(function(r){return '<button class="mi'+(p.done[r]?' ok':'')+(p.flash===r?' bad':'')+'" data-act="m-right" data-i="'+r+'"'+(p.done[r]?' disabled':'')+'>'+esc(ex.pairs[r][1])+'</button>';}).join('')+'</div></div>';
  }else{
    body='<p class="ls-kind">Reflexión para tu diario</p><h2 class="ls-q">'+esc(ex.q)+'</h2><textarea id="ref-text" aria-label="Tu reflexión" placeholder="'+esc(ex.hint)+'">'+esc(p.text)+'</textarea><p class="muted small">'+(L.review?'En el repaso no se guarda en el diario.':'Se guarda en Mi diario.')+'</p>';
    foot='<button id="btn-ref" class="btn primary big" data-act="reflect-save"'+(p.text.trim().length>=8?'':' disabled')+'>'+(L.review?'Continuar':'Guardar y continuar')+'</button>';
  }
  if(fb){foot='<div class="fb '+(L.fb.good?'good':'bad')+'"><b>'+(L.fb.good?'Para recordar':'Para tener en cuenta')+'</b>'+(L.fb.msg?'<p>'+esc(L.fb.msg)+'</p>':'')+'</div><button class="btn primary big" data-act="next">Continuar</button>';}
  if(!L.tip||L.tipEi!==L.ei){L.tip=tipFor(ex);L.tipEi=L.ei;}
  var mood=fb?(L.fb.good?'cheer':'oops'):(ex.k==='reflect'?'happy':'think');
  var mrowH=mrow(76,mood,fb?L.fb.title:L.tip,fb?(L.fb.good?'hop':'shake'):'');
  var exitBox=L.exit?'<div class="confirm"><span>¿Salir de la lección? Perderás el avance de este nivel.</span><div class="row"><button class="btn danger sm" data-act="lesson-quit">Salir</button><button class="btn sm" data-act="exit-no">Seguir</button></div></div>':'';
  el.innerHTML='<div class="ls-head"><button class="icon-btn" data-act="lesson-exit" aria-label="Salir de la lección">'+ic('x')+'</button><div class="progress"><i style="width:'+(L.ei/total*100)+'%"></i></div><span class="sk-dot" style="--c:'+sk.c+'" title="'+esc(sk.name)+'">'+ic(sk.id,15)+'</span></div><div class="ls-body">'+exitBox+mrowH+body+'</div><div class="ls-foot">'+foot+'</div>';
  aim();
}
function advance(){
  var L=ui.lesson;L.ei++;
  if(L.ei>=L.lesson.ex.length){
    if(L.review){L.xp=0;}
    else{L.xp+=20;state.done[L.idx]={date:today(),xp:L.xp,ok:L.ok,tot:L.tot};state.xp+=L.xp;save();sendSheetEvent('nivel_completado',{lessonIndex:L.idx,skill:L.skill,lessonTitle:L.lesson.t,xp:L.xp,ok:L.ok,tot:L.tot});}
    L.phase='summary';
  }else{L.p=prep(curEx());L.phase='q';L.fb=null;}
  renderLesson();
}

/* ---------- Render principal ---------- */
function navHtml(){
  var items=[['ruta','route','Ruta'],['diario','book','Diario'],['cal','cal','Calendario'],['perfil','user','Perfil']];
  return '<div class="nav-in">'+items.map(function(i){return '<button class="'+(ui.view===i[0]?'on':'')+'" data-act="nav" data-v="'+i[0]+'">'+ic(i[1],24)+'<span>'+i[2]+'</span></button>';}).join('')+'</div>';
}
function render(){
  var app=$('#app'),nav=$('#nav');
  if(!state.onboarded){nav.hidden=true;app.innerHTML=viewOnboarding();aim();return;}
  if(!ui.cal){var t=parse(today());ui.cal={y:t.getFullYear(),m:t.getMonth(),sel:today()};}
  nav.hidden=false;nav.innerHTML=navHtml();
  var v=ui.view;
  app.innerHTML=v==='ruta'?viewRuta():v==='diario'?viewDiario():v==='cal'?viewCal():viewPerfil();
  aim();
}

/* ---------- Vida de la mascota: parpadeo, mirada y saltos ---------- */
var ptr=null,lastPtr=0,raf=0;
function mascots(){return document.querySelectorAll('.mascot');}
function aim(){
  if(!ptr)return;
  mascots().forEach(function(m){
    var r=m.getBoundingClientRect();if(!r.width)return;
    var dx=ptr.x-(r.left+r.width/2),dy=ptr.y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160);
    m.style.setProperty('--lx',(dx/d*k).toFixed(2));m.style.setProperty('--ly',(dy/d*k).toFixed(2));
  });
}
document.addEventListener('pointermove',function(e){
  ptr={x:e.clientX,y:e.clientY};lastPtr=Date.now();
  if(!raf)raf=requestAnimationFrame(function(){raf=0;aim();});
});
setInterval(function(){
  if(Date.now()-lastPtr<4000)return;
  ptr=null;var x=(Math.random()*2-1).toFixed(2),y=(Math.random()*1.4-.7).toFixed(2);
  mascots().forEach(function(m){m.style.setProperty('--lx',x);m.style.setProperty('--ly',y);});
},2800);
function blinkLoop(){
  setTimeout(function(){
    mascots().forEach(function(m){m.classList.add('blink');});
    setTimeout(function(){
      mascots().forEach(function(m){m.classList.remove('blink');});
      if(Math.random()<.25){setTimeout(function(){mascots().forEach(function(m){m.classList.add('blink');});setTimeout(function(){mascots().forEach(function(m){m.classList.remove('blink');});},120);},180);}
    },130);
    blinkLoop();
  },2200+Math.random()*3200);
}
blinkLoop();
function hop(svg){svg.classList.remove('hop');void svg.getBoundingClientRect();svg.classList.add('hop');setTimeout(function(){svg.classList.remove('hop');},700);}

/* ---------- Acciones ---------- */
var A={
 'mtap':function(d,e,t){
  var svg=t.querySelector('svg');if(svg)hop(svg);
  var box=t.closest('.mrow,.mbox,.sum'),st=box&&box.querySelector('.say-t');
  if(st)st.textContent=pick(TAPS);
 },
 'ob-start':function(){ui.step='reg';render();},
 'prog':function(d){ui.reg.program=d.p;render();},
 'reg-next':function(){ui.reg.name=$('#f-name').value;ui.reg.sem=$('#f-sem').value;ui.step='diag';ui.q=0;ui.ans=[];render();},
 'diag-back':function(){if(ui.q>0){ui.q--;}else{ui.step='reg';}render();},
 'ans':function(d){
  ui.ans[ui.q]=+d.v;
  if(ui.q<DIAG.length-1){ui.q++;}
  else{var sc={};DIAG.forEach(function(q,i){sc[q[0]]=ui.ans[i];});ui.scores=sc;ui.step='result';}
  render();window.scrollTo(0,0);
 },
 'ob-finish':function(){
  state.name=ui.reg.name.trim();state.program=ui.reg.program;state.semester=String(ui.reg.sem);
  state.answers=ui.ans.slice();state.scores=ui.scores;state.journey=buildJourney(ui.scores);
  state.start=ymd(new Date());state.demo=0;state.done={};state.xp=0;state.onboarded=true;
  save();sendSheetEvent('diagnostico_completado',{answers:state.answers,scores:state.scores,journey:state.journey.map(function(j){return j.s;})});ui.view='ruta';ui.cal=null;ui.confirm=null;render();window.scrollTo(0,0);
 },
 'nav':function(d){ui.view=d.v;ui.confirm=null;ui.delId=null;render();window.scrollTo(0,0);},
 'open':function(d){
  var i=+d.i;
  if(i>dayIdx()){toast('Este nivel se desbloquea el '+fmt(addDays(state.start,i)));return;}
  if(state.done[i])toast('Repaso: no suma XP');
  openLesson(i,!!state.done[i]);
 },
 /* lección */
 'pick':function(d){ui.lesson.p.sel=+d.i;renderLesson();},
 'check':function(){
  var L=ui.lesson,ex=curEx(),p=L.p,good;
  if(ex.k==='choice'){
    good=p.opts[p.sel].i===ex.a;L.tot++;if(good){L.ok++;L.xp+=10;}else{L.xp+=2;}
    L.fb={good:good,title:pick(good?FB_OK:FB_NO),msg:(good?'':'La mejor opción era: “'+ex.o[ex.a]+'”. ')+ex.why};
  }else{
    good=p.ans.every(function(v,i){return v===i;});L.tot++;if(good){L.ok++;L.xp+=10;}else{L.xp+=2;}
    L.fb={good:good,title:pick(good?FB_OK:FB_NO),msg:good?ex.why:'El orden correcto es: '+ex.items.map(function(t,i){return (i+1)+'. '+t;}).join('  ')};
  }
  L.phase='fb';renderLesson();
 },
 'ord-add':function(d){var p=ui.lesson.p,v=+d.i,k=p.bank.indexOf(v);if(k>-1){p.bank.splice(k,1);p.ans.push(v);}renderLesson();},
 'ord-rem':function(d){var p=ui.lesson.p,k=+d.i;if(k<p.ans.length){var v=p.ans.splice(k,1)[0];p.bank.push(v);}renderLesson();},
 'm-left':function(d){ui.lesson.p.selL=+d.i;ui.lesson.p.flash=-1;renderLesson();},
 'm-right':function(d){
  var L=ui.lesson,p=L.p,r=+d.i;
  if(p.selL===null){toast('Primero toca un elemento de la izquierda');return;}
  if(p.selL===r){
    p.done[r]=true;p.selL=null;p.flash=-1;
    if(p.done.every(Boolean)){
      L.tot++;var good=p.miss===0;if(good)L.ok++;L.xp+=p.miss<=1?10:5;
      L.fb={good:true,title:'¡Parejas completas!',msg:p.miss?'Tuviste '+p.miss+' intento'+(p.miss>1?'s':'')+' fallido'+(p.miss>1?'s':'')+'. Repásalas y sigue.':'Sin errores.'};
      L.phase='fb';
    }
  }else{
    p.miss++;p.flash=r;p.selL=null;
    setTimeout(function(){if(ui.lesson===L&&L.p===p&&p.flash===r){p.flash=-1;renderLesson();}},700);
  }
  renderLesson();
 },
 'reflect-save':function(){
  var L=ui.lesson,ex=curEx(),txt=L.p.text.trim();
  if(txt.length<8)return;
  if(!L.review){L.xp+=15;state.diary.unshift({id:uid(),date:today(),type:'reflexion',skill:L.skill,prompt:ex.q,text:txt,mood:''});save();sendSheetEvent('reflexion',{skill:L.skill,prompt:ex.q,response:txt,mood:'',lessonIndex:L.idx});}
  advance();
 },
 'next':function(){advance();},
 'lesson-exit':function(){ui.lesson.exit=true;renderLesson();},
 'exit-no':function(){ui.lesson.exit=false;renderLesson();},
 'lesson-quit':function(){ui.lesson=null;renderLesson();render();},
 'lesson-close':function(){ui.lesson=null;renderLesson();render();window.scrollTo(0,0);},
 /* diario */
 'diary-open':function(){ui.diaryOpen=true;render();},
 'diary-close':function(){ui.diaryOpen=false;ui.draft={mood:'',skill:'',text:''};render();},
 'mood':function(d){ui.draft.mood=ui.draft.mood===d.m?'':d.m;render();},
 'diary-save':function(){
  var t=ui.draft.text.trim();if(t.length<3)return;
  var di=Math.max(0,dayIdx());
  state.diary.unshift({id:uid(),date:today(),type:'libre',skill:ui.draft.skill||'',prompt:PROMPTS[di%PROMPTS.length],text:t,mood:ui.draft.mood});
  save();sendSheetEvent('entrada_diario',{skill:ui.draft.skill||'',prompt:PROMPTS[di%PROMPTS.length],response:t,mood:ui.draft.mood});ui.draft={mood:'',skill:'',text:''};ui.diaryOpen=false;render();toast('Entrada guardada');
 },
 'filter':function(d){ui.filter=d.f;render();},
 'del-ask':function(d){ui.delId=d.id;render();},
 'del-no':function(){ui.delId=null;render();},
 'del-yes':function(d){state.diary=state.diary.filter(function(e){return e.id!==d.id;});ui.delId=null;save();render();toast('Entrada eliminada');},
 /* calendario */
 'cal-sel':function(d){ui.cal.sel=d.d;render();},
 'cal-prev':function(){var c=ui.cal;c.m--;if(c.m<0){c.m=11;c.y--;}render();},
 'cal-next':function(){var c=ui.cal;c.m++;if(c.m>11){c.m=0;c.y++;}render();},
 'cal-today':function(){ui.cal=null;render();},
 /* perfil */
 'edit-save':function(){
  var n=$('#e-name').value.trim();if(n.length<2){toast('Escribe tu nombre');return;}
  state.name=n;state.program=$('#e-prog').value;state.semester=$('#e-sem').value;save();sendSheetEvent('perfil_actualizado',{name:n,program:state.program,semester:state.semester});render();toast('Cambios guardados');
 },
 'retake':function(){ui.confirm='retake';render();},
 'retake-yes':function(){ui.reg={name:state.name,program:state.program,sem:state.semester||'3'};state.onboarded=false;state.done={};state.xp=0;save();ui.confirm=null;ui.step='diag';ui.q=0;ui.ans=[];render();window.scrollTo(0,0);},
 'wipe':function(){ui.confirm='wipe';render();},
 'wipe-yes':function(){state=fresh();save();ui.reg={name:'',program:'',sem:'3'};ui.step='welcome';ui.view='ruta';ui.cal=null;ui.confirm=null;ui.diaryOpen=false;render();window.scrollTo(0,0);},
 'conf-no':function(){ui.confirm=null;render();},
 'demo-next':function(){state.demo++;save();ui.cal=null;render();toast('Hoy en la app: '+fmt(today()));},
 'demo-reset':function(){state.demo=0;save();ui.cal=null;render();toast('Volviste al día real');}
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=A[t.dataset.act];if(f)f(t.dataset,e,t);
});
document.addEventListener('input',function(e){
  var id=e.target.id,v=e.target.value;
  if(id==='f-name'){ui.reg.name=v;var b=$('#btn-reg');if(b)b.disabled=!(v.trim().length>=2&&ui.reg.program);var sy=$('#say-reg');if(sy)sy.textContent=regSay();}
  else if(id==='diary-text'){ui.draft.text=v;var b2=$('#btn-diary');if(b2)b2.disabled=v.trim().length<3;}
  else if(id==='ref-text'&&ui.lesson){ui.lesson.p.text=v;var b3=$('#btn-ref');if(b3)b3.disabled=v.trim().length<8;}
});
document.addEventListener('change',function(e){
  if(e.target.id==='diary-skill')ui.draft.skill=e.target.value;
});

render();
})();
</script>
